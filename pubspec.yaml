name: conduit_workspace
version: 7.0.0
home: https://www.theconduit.dev
repository: https://github.com/conduit-dart/conduit
issue_tracker: https://github.com/conduit-dart/conduit/issues

environment:
  sdk: ">=3.12.0 <4.0.0"

dev_dependencies:
  # 7.4.0 introduced layered topological sort for `melos exec
  # --order-dependents`, which is what the publish workflow relies on.
  # 7.7.0 fixes pubspec_overrides handling under workspace resolution.
  melos: ^7.7.0

workspace:
  - packages/build_runner
  - packages/cli
  - packages/codable
  - packages/common
  - packages/config
  - packages/core
  - packages/graph
  - packages/graph_neo4j
  - packages/graphql
  - packages/isolate_exec
  - packages/open_api
  - packages/password_hash
  - packages/mysql
  - packages/postgresql
  - packages/runtime
  - packages/sqlite
  - packages/test_harness
  - packages/fs_test_agent
  - examples/graphql_cross_source

melos:
  command:
    version:
      linkToCommits: true
  scripts:
    test-unit:
      run: melos exec -c1 --fail-fast --ignore "*common*" --ignore "*application*" --ignore "*dependency*" -- "dart test -r failures-only"
      packageFilters:
        noPrivate: true
    test-with-coverage:
      run: melos exec --ignore "*common*" --ignore "*application*" --ignore "*dependency*" -- "dart MELOS_ROOT_PATH/utils/unused_port.dart | dart pub global run coverage:test_with_coverage --port -"
      packageFilters:
        noPrivate: true
    test-fast:
      description: |
        Database-free unit tests: the same scope as the Woodpecker
        build-runner-tests + workspace-unit-tests steps. A cheap local
        gate before the Postgres-backed test-unit suite. The env-var
        prefix (required by conduit_config tests) makes this POSIX-only.
      run: >
        melos exec -c1 --fail-fast
        --scope conduit_build_runner
        --scope conduit_codable
        --scope conduit_open_api
        --scope conduit_password_hash
        --scope conduit_config
        -- "TEST_VALUE=1 TEST_BOOL=true TEST_DB_ENV_VAR=postgres://user:password@host:5432/dbname dart test -r failures-only"
    analyze: melos exec -- dart analyze .
    upgrade: melos exec -- dart pub upgrade
    outdated:
      run: melos exec -- "dart pub outdated"
    activate-all:
      run: melos exec -- "dart pub global activate -spath MELOS_PACKAGE_PATH"
      packageFilters:
        noPrivate: true
    deactivate-all:
      run: melos exec -- "dart pub global deactivate MELOS_PACKAGE_NAME"
      packageFilters:
        noPrivate: true
    cache-source:
      run: melos exec -- "mkdir -p '$PUB_CACHE/hosted/pub.dev/MELOS_PACKAGE_NAME-MELOS_PACKAGE_VERSION' && cp -rf 'MELOS_PACKAGE_PATH'/* '$PUB_CACHE/hosted/pub.dev/MELOS_PACKAGE_NAME-MELOS_PACKAGE_VERSION'"
      packageFilters:
        noPrivate: true
    cache-source-win:
      run: melos exec -- mkdir %PUB_CACHE%\hosted\pub.dev\MELOS_PACKAGE_NAME-MELOS_PACKAGE_VERSION && melos exec -- xcopy MELOS_PACKAGE_PATH %PUB_CACHE%\hosted\pub.dev\MELOS_PACKAGE_NAME-MELOS_PACKAGE_VERSION /Y /s /e
      packageFilters:
        noPrivate: true
    hard-clean:
      run: melos exec -- "rm -rf 'MELOS_PACKAGE_PATH/.dart_tool' 'MELOS_PACKAGE_PATH/pubspec.lock'"
    gen-docs:
      run: |
        melos exec --ignore "*common*" --ignore "fs_test_agent" -- "dart doc"
      packageFilters:
        noPrivate: true
    fix:
      run: melos exec --fail-fast --ignore "*common*" --ignore "*application*" --ignore "*dependency*" -- "dart fix --apply ."
    build-aot:
      description: Build the Dart-beta AOT-builder image used to AOT-compile Conduit apps.
      run: docker build -t conduit-aot-builder -f docker/Dockerfile.flutter-aot --target aot-builder .
    release-rehearsal:
      description: |
        Rehearse a release by publishing the workspace to a self-hosted pub
        server (any pub-compatible host, e.g. unpub) instead of pub.dev, to
        verify the full publish + consume round-trip before tagging. Requires
        PUB_SERVER_URL and PUB_TOKEN.
      run: tool/release-rehearsal.sh
    sync-version:
      run: |
        export v=`dart pub deps -s list | grep conduit_workspace | awk '{print $2}' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'`; \
        melos version  --yes -V conduit:$v \
                            -V conduit_build_runner:$v \
                            -V conduit_codable:$v \
                            -V conduit_common:$v \
                            -V conduit_config:$v \
                            -V conduit_core:$v \
                            -V conduit_graph:$v \
                            -V conduit_graph_neo4j:$v \
                            -V conduit_graphql:$v \
                            -V conduit_isolate_exec:$v \
                            -V conduit_mysql:$v \
                            -V conduit_open_api:$v \
                            -V conduit_password_hash:$v \
                            -V conduit_postgresql:$v \
                            -V conduit_runtime:$v \
                            -V conduit_sqlite:$v \
                            -V conduit_test:$v \
                            -V fs_test_agent:$v
