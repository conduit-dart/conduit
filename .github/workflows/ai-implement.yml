# AI pipeline, stage 2: implementation.
#
# Trigger: a maintainer adds `deps:approved` after ticking one candidate
# (Gate 2), or the research stage dispatches it when no dependency is
# needed. The agent edits the tree; this workflow re-checks everything and
# does the commit/push/PR itself, so the agent never holds a push
# credential. The PR then goes through the normal CI gates and needs a
# maintainer's review. See docs/AI_PIPELINE.md.
name: AI implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  contents: read
  issues: read

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'deps:approved'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tool/ai/gate.sh
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          ENABLED: ${{ vars.AI_PIPELINE_ENABLED }}
          TRIGGERS: ${{ vars.AI_PIPELINE_TRIGGERS }}
          ACTOR: ${{ github.triggering_actor }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          REQUIRED_LABELS: ai:approved
          FORBIDDEN_LABELS: ai:tracking ai:manual split:review
          SKIP_SENDER_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: tool/ai/gate.sh

  implement:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    # Job-level, not workflow-level: every `issues: labeled` event starts this
    # workflow, and GitHub keeps only one *pending* run per concurrency group,
    # so a workflow-level group let unrelated label events cancel a pending
    # run that mattered. Only a job whose gate opened joins the group.
    concurrency:
      group: ai-issue-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    runs-on: [self-hosted, conduit-ai]
    timeout-minutes: 120
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # After the agent runs, later steps must not run anything it could have
      # planted (docs/AI_PIPELINE.md, "Containing the agent"): no
      # user-writable directory on PATH, no gh configuration, and git only
      # once its configuration matches the fingerprint taken before the agent.
      PATH: /opt/dart-sdk/bin:/usr/lib/postgresql/18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GH_CONFIG_DIR: /nonexistent/gh
      GH_NO_UPDATE_NOTIFIER: "1"
      GIT_FINGERPRINT: >-
        { cat .git/config .git/info/* .git/objects/info/alternates .git/hooks/*
        ~/.gitconfig ~/.config/git/* 2>/dev/null;
        ls -A .git/hooks .git/info ~/.config/git 2>/dev/null; } | sha256sum
      # Paths the agent may not change: CI, the pipeline itself, and the
      # configuration the checks read (lint rules, melos scripts, test config).
      PROTECTED_PATHS: '^(\.github/|tool/ai/|ci/|docker/|\.woodpecker\.yml$|flake\.(nix|lock)$|pubspec\.yaml$|(.*/)?analysis_options[^/]*\.yaml$|(.*/)?dart_test\.yaml$)'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "15432"
      POSTGRES_USER: conduit_test_user
      POSTGRES_PASSWORD: conduit!
      POSTGRES_DB: conduit_test_db
      TEST_DB_ENV_VAR: postgres://user:password@host:5432/dbname
      TEST_VALUE: "1"
      TEST_BOOL: "true"
      # start-test-postgres enables PostGIS, as Linux CI does.
      CONDUIT_POSTGIS: "true"
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_APP_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}
          # Revoked by the last step instead: the action's post step gets the
          # token and runs action code from a directory the agent can write to.
          skip-token-revoke: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          # No token input (post steps get the same inputs) and no persisted
          # credentials: the agent must find no push token in the workspace.
          persist-credentials: false

      - name: Resolve inputs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FROM_LABEL: ${{ github.event_name == 'issues' }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --add-label ai:implementing \
            --remove-label deps:review --remove-label ai:blocked --remove-label ai:retry
          mkdir -p .ai
          gh issue view "$ISSUE" --repo "$REPO" --json number,title,body,labels,comments > .ai/issue.json

          # Latest research note posted by the pipeline.
          jq -r '[.comments[] | select(.body | startswith("<!-- conduit-ai:research -->"))] | last | .body // ""' \
            .ai/issue.json > .ai/research.md
          test -s .ai/research.md || { echo "no research note on #$ISSUE" >&2; exit 1; }

          # Gate 2: the ticked candidate, or in-house when research said no dependency.
          candidates=$(jq -r '[.comments[] | select(.body | startswith("<!-- conduit-ai:deps-candidates -->"))] | last | .body // ""' .ai/issue.json)
          if [ -n "$candidates" ]; then
            printf '%s' "$candidates" > .ai/candidates.md
            dart pub get >/dev/null
            dart run tool/ai/bin/dep_candidates.dart --parse-choice .ai/candidates.md > .ai/dependency.txt
          elif [ "$FROM_LABEL" = "true" ]; then
            echo "deps:approved was added but there is no candidates comment" >&2; exit 1
          else
            echo in-house > .ai/dependency.txt
          fi
          echo "dependency: $(cat .ai/dependency.txt)"

          # One open AI PR per issue: a retry must not clobber a PR under review.
          slug=$(jq -r .title .ai/issue.json | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//; s/-*$//' | cut -c1-40 | sed 's/-*$//')
          branch="claude/ai-issue-${ISSUE}-${slug:-feature}"
          open=$(gh pr list --repo "$REPO" --state open --search "head:claude/ai-issue-${ISSUE}-" --json url --jq '.[0].url // empty')
          if [ -n "$open" ]; then
            echo "an AI PR is already open for #$ISSUE: $open (review or close it before retrying)" >&2; exit 1
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Prepare workspace
        id: prep
        run: |
          git switch -c "$BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "gitfp=$(bash -c "$GIT_FINGERPRINT")" >> "$GITHUB_OUTPUT"
          dart pub get
          start-test-postgres

      - name: Implement (agent)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          tool/ai/run-agent.sh .github/ai/prompts/implement.md 150 \
            "Read,Edit,Write,Glob,Grep,WebFetch(domain:pub.dev),WebFetch(domain:dart.dev),Bash(dart:*),Bash(melos:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*)"
          if [ -s .ai/blocked.md ]; then
            echo "agent stopped:" >&2; cat .ai/blocked.md >&2; exit 1
          fi
          test -s .ai/commit-title.txt && test -s .ai/pr-body.md

      - name: Verify (deterministic)
        env:
          BASE: ${{ steps.prep.outputs.base }}
          GITFP: ${{ steps.prep.outputs.gitfp }}
        run: |
          # The agent could run code, so check git before running git, and the
          # tree before running anything from it.
          [ "$(bash -c "$GIT_FINGERPRINT")" = "$GITFP" ] \
            || { echo "git configuration or hooks changed during the agent run" >&2; exit 1; }
          [ "$(git branch --show-current)" = "$BRANCH" ] || { echo "agent changed branch" >&2; exit 1; }
          git add -A
          git reset -q -- .ai
          protected=$(git diff --cached --name-only "$BASE" | grep -E "$PROTECTED_PATHS" || true)
          [ -z "$protected" ] || { echo "agent changed protected paths:" >&2; echo "$protected" >&2; exit 1; }
          ! git diff --cached --quiet "$BASE" || { echo "agent made no changes" >&2; exit 1; }
          mapfile -t pkgs < <(git diff --cached --name-only "$BASE" -- 'packages/*' | cut -d/ -f1-2 | sort -u)

          approve=()
          dep=$(cat .ai/dependency.txt)
          [ "$dep" = in-house ] || approve=(--approve "$dep")

          # Everything below runs code the agent wrote or could have changed
          # (tests, the pub cache, melos), so it runs contained and secret-free.
          tool/ai/contain.sh bash -euo pipefail -c '
            export PATH="$PATH:$HOME/.pub-cache/bin"
            dart run tool/ai/bin/new_deps.dart --base "$BASE" "$@"
            dart format --output=none --set-exit-if-changed .
            melos run analyze
          ' new_deps "${approve[@]}"

          # Tests of every package the change touches.
          for p in "${pkgs[@]}"; do
            [ -d "$p/test" ] || continue
            echo "::group::dart test $p"
            (cd "$p" && "$GITHUB_WORKSPACE/tool/ai/contain.sh" dart test -r failures-only)
            echo "::endgroup::"
          done

      - name: Commit, push, open PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BASE: ${{ steps.prep.outputs.base }}
          GITFP: ${{ steps.prep.outputs.gitfp }}
        run: |
          # The verify step ran the agent's tests; check git and the tree again.
          [ "$(bash -c "$GIT_FINGERPRINT")" = "$GITFP" ] \
            || { echo "git configuration or hooks changed during verification" >&2; exit 1; }
          title=$(head -1 .ai/commit-title.txt)
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          # Commit what verify staged before the tests ran, not files the tests
          # wrote. The index is re-checked: test code could have rewritten it.
          git reset -q -- .ai
          protected=$(git diff --cached --name-only "$BASE" | grep -E "$PROTECTED_PATHS" || true)
          [ -z "$protected" ] || { echo "protected paths changed:" >&2; echo "$protected" >&2; exit 1; }
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -q -m "$title" -m "Implements #${ISSUE}. Generated by the AI pipeline: $RUN_URL"
          # The checkout keeps no credentials (persist-credentials: false), so
          # the App token is passed to this one push only.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push -q origin "$BRANCH"
          # The local checks trust an object store the agent could write to;
          # GitHub's view of the pushed branch is authoritative.
          bad=$(gh api "repos/$REPO/compare/$BASE...$BRANCH" --jq '.files[].filename' | grep -E "$PROTECTED_PATHS" || true)
          if [ -n "$bad" ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
            echo "the pushed branch changes protected paths, so it was deleted:" >&2; echo "$bad" >&2; exit 1
          fi
          {
            cat .ai/pr-body.md
            echo
            echo "Closes #${ISSUE}"
            echo
            echo "<sub>Opened by the AI pipeline · [run]($RUN_URL) · dependency: \`$(cat .ai/dependency.txt)\`</sub>"
          } > .ai/pr.md
          url=$(gh pr create --repo "$REPO" --base master --head "$BRANCH" \
            --label bot:ai-pipeline --title "$title" --body-file .ai/pr.md)
          gh issue edit "$ISSUE" --repo "$REPO" --add-label ai:in-review
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Implementation opened as $url. It runs the normal CI and needs a maintainer's review to merge; AI review notes will follow here."

      - name: Clear stage
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --remove-label ai:implementing || true

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --add-label ai:blocked || true
          {
            echo "The implementation stage failed. See the [run]($RUN_URL)."
            if [ -s .ai/blocked.md ]; then echo; echo "The agent reported:"; echo; cat .ai/blocked.md; fi
            echo
            echo "A maintainer can add \`ai:retry\` to run it again."
          } > .ai/failure.md 2>/dev/null || true
          gh issue comment "$ISSUE" --repo "$REPO" --body-file .ai/failure.md || true

      - name: Revoke App token
        if: always() && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api -X DELETE installation/token || true
