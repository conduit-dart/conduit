# AI pipeline, stage 3: review notes.
#
# Runs on pull requests from the pipeline's own branches
# (`claude/ai-issue-<n>-*` in this repository, never forks). Posts the AI
# review to the linked issue and a pointer on the PR. It never approves or
# merges: the normal CI and a maintainer's review remain the gate.
#
# The agent job holds read-only permissions; a separate GitHub-hosted job
# posts the review, so no write token is ever in the agent's container.
# See docs/AI_PIPELINE.md.
name: AI review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  gate:
    if: >-
      vars.AI_PIPELINE_ENABLED == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'claude/ai-issue-')
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.author.outputs.ok }}
    steps:
      # Only PRs the pipeline opened (its App bot) or that someone on
      # AI_PIPELINE_TRIGGERS opened get a review on the subscription.
      - id: author
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TRIGGERS: ${{ vars.AI_PIPELINE_TRIGGERS }}
        run: |
          ok=false
          case "$AUTHOR" in *"[bot]") ok=true ;; esac
          if [ -z "${TRIGGERS//[ ,]/}" ]; then ok=true; fi
          for login in ${TRIGGERS//,/ }; do
            [ "${login,,}" = "${AUTHOR,,}" ] && ok=true
          done
          echo "PR author ${AUTHOR}: ok=${ok}"
          echo "ok=${ok}" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: [self-hosted, conduit-ai]
    timeout-minutes: 45
    outputs:
      issue: ${{ steps.ctx.outputs.issue }}
      review: ${{ steps.agent.outputs.review }}
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # After the agent runs, later steps must not run anything it could have
      # planted (docs/AI_PIPELINE.md, "Containing the agent"): no
      # user-writable directory on PATH, no gh configuration, and git only
      # once its configuration matches the fingerprint taken before the agent.
      PATH: /opt/dart-sdk/bin:/usr/lib/postgresql/18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GH_CONFIG_DIR: /nonexistent/gh
      GH_NO_UPDATE_NOTIFIER: "1"
      GIT_FINGERPRINT: >-
        { cat .git/config .git/info/* .git/objects/info/alternates .git/hooks/*
        ~/.gitconfig ~/.config/git/* 2>/dev/null;
        ls -A .git/hooks .git/info ~/.config/git 2>/dev/null; } | sha256sum
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Load issue context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(sed -nE 's#^claude/ai-issue-([0-9]+)-.*#\1#p' <<<"$HEAD_REF")
          [ -n "$issue" ] || { echo "cannot read an issue number from $HEAD_REF" >&2; exit 1; }
          echo "ISSUE=$issue" >> "$GITHUB_ENV"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          mkdir -p .ai
          gh issue view "$issue" --repo "$REPO" --json number,title,body,comments > .ai/issue.json
          jq -r '[.comments[] | select(.body | startswith("<!-- conduit-ai:research -->"))] | last | .body // ""' \
            .ai/issue.json > .ai/research.md
          git fetch -q origin master
          echo "gitfp=$(bash -c "$GIT_FINGERPRINT")" >> "$GITHUB_OUTPUT"

      - name: Review (agent)
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITFP: ${{ steps.ctx.outputs.gitfp }}
        run: |
          tool/ai/run-agent.sh .github/ai/prompts/review.md 60 \
            "Read,Glob,Grep,Write(.ai/review.md),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          # `git diff/log --output=<file>` can write any file: check git first.
          [ "$(bash -c "$GIT_FINGERPRINT")" = "$GITFP" ] \
            || { echo "git configuration or hooks changed during the agent run" >&2; exit 1; }
          stray=$(git status --porcelain --untracked-files=all | grep -v ' \.ai/' || true)
          [ -z "$stray" ] || { echo "review agent changed files outside .ai/:" >&2; echo "$stray" >&2; exit 1; }
          test -s .ai/review.md
          delim="EOF_$(od -An -N8 -tx8 /dev/urandom | tr -d ' ')"
          { echo "review<<$delim"; cat .ai/review.md; echo; echo "$delim"; } >> "$GITHUB_OUTPUT"

  post:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      ISSUE: ${{ needs.review.outputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post review notes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW: ${{ needs.review.outputs.review }}
        run: |
          mkdir -p .ai
          printf '%s\n' "$REVIEW" > .ai/review.md
          {
            echo "<!-- conduit-ai:review -->"
            echo "## AI review of #${PR} (\`${HEAD_SHA:0:8}\`)"
            echo
            cat .ai/review.md
            echo
            echo "<sub>AI pipeline · [run]($RUN_URL) · not a merge gate; a maintainer reviews and merges.</sub>"
          } > .ai/comment.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file .ai/comment.md
          verdict=$(sed -n '/^### Verdict/{n;:a;/^[[:space:]]*$/{n;ba};p;q}' .ai/review.md | head -c 200)
          gh pr comment "$PR" --repo "$REPO" \
            --body "AI review posted on #${ISSUE}. Verdict: ${verdict:-see the issue}"
