# AI pipeline, stage 1: package report + research.
#
# Trigger: a maintainer adds `ai:approved` to a feature request (Gate 1),
# or `ai-retry.yml` dispatches it. The gate job runs on a GitHub-hosted
# runner; only an open gate schedules work on the self-hosted `conduit-ai`
# runner. See docs/AI_PIPELINE.md.
name: AI research

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  contents: read
  issues: read

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai:approved'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tool/ai/gate.sh
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          ENABLED: ${{ vars.AI_PIPELINE_ENABLED }}
          TRIGGERS: ${{ vars.AI_PIPELINE_TRIGGERS }}
          ACTOR: ${{ github.triggering_actor }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          REQUIRED_LABELS: ai:approved
          FORBIDDEN_LABELS: ai:tracking ai:manual
          SKIP_SENDER_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: tool/ai/gate.sh

  research:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    # Job-level, not workflow-level: every `issues: labeled` event starts this
    # workflow, and GitHub keeps only one *pending* run per concurrency group,
    # so a workflow-level group let unrelated label events cancel a pending
    # run that mattered. Only a job whose gate opened joins the group.
    concurrency:
      group: ai-issue-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    runs-on: [self-hosted, conduit-ai]
    timeout-minutes: 60
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_APP_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Mark stage
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --add-label ai:researching \
            --remove-label ai:triage --remove-label ai:blocked --remove-label ai:retry \
            --remove-label split:review
          mkdir -p .ai
          gh issue view "$ISSUE" --repo "$REPO" --json number,title,body,labels,comments > .ai/issue.json

      - name: Package report (deterministic)
        # Report-only: list outdated direct dependencies in the research note.
        # Upgrades come through Dependabot, which runs full CI. Opening a PR
        # here after only analyze + test-fast let a melos 8 bump that breaks
        # CI setup through looking green (#316).
        run: |
          dart pub get
          dart pub outdated --json > .ai/outdated.json || echo '{"packages":[]}' > .ai/outdated.json
          jq -r -f tool/ai/outdated_report.jq .ai/outdated.json > .ai/deps-refresh.md

      - name: Research (agent)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          tool/ai/run-agent.sh .github/ai/prompts/research.md 60 \
            "Read,Glob,Grep,Write(.ai/**),WebFetch(domain:pub.dev),WebFetch(domain:dart.dev),Bash(dart pub deps:*),Bash(git log:*)"
          test -s .ai/research.md
          jq -e '(.needs_dependency | type) == "boolean" and (.candidates | type) == "array"' .ai/research.json
          # A malformed split proposal fails the stage rather than being ignored.
          dart run tool/ai/bin/split_plan.dart --count .ai/research.json
          if ! git diff --quiet; then
            echo "research agent modified tracked files:" >&2; git diff --stat >&2; exit 1
          fi

      - name: Post research note
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          {
            echo "<!-- conduit-ai:research -->"
            echo "## Research"
            echo
            cat .ai/research.md
            echo
            echo "### Outdated dependencies"
            echo
            cat .ai/deps-refresh.md
            echo
            echo "<sub>AI pipeline · [run]($RUN_URL)</sub>"
          } > .ai/comment.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file .ai/comment.md

      - name: Split proposal, dependency candidates (Gate 2), or hand off to implementation
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Too large for one PR: propose sub-issues and stop. Each sub-issue
          # gets its own research and dependency gate once created, so the
          # parent's dependency candidates are not posted.
          if [ "$(dart run tool/ai/bin/split_plan.dart --count .ai/research.json)" != 0 ]; then
            dart run tool/ai/bin/split_plan.dart --render .ai/research.json > .ai/split.md
            echo >> .ai/split.md
            echo "<sub>AI pipeline · [run]($RUN_URL)</sub>" >> .ai/split.md
            gh issue comment "$ISSUE" --repo "$REPO" --body-file .ai/split.md
            gh issue edit "$ISSUE" --repo "$REPO" --add-label split:review
          elif [ "$(jq -r .needs_dependency .ai/research.json)" = "true" ]; then
            jq -r '.rationale // {}' .ai/research.json > .ai/rationale.json
            mapfile -t names < <(jq -r '.candidates[]' .ai/research.json)
            sdk_floor=$(grep -m1 -oE 'sdk: ">=[0-9.]+' pubspec.yaml | grep -oE '[0-9.]+$')
            dart run tool/ai/bin/dep_candidates.dart --sdk-floor "$sdk_floor" \
              --rationale .ai/rationale.json "${names[@]}" > .ai/candidates.md
            gh issue comment "$ISSUE" --repo "$REPO" --body-file .ai/candidates.md
            gh issue edit "$ISSUE" --repo "$REPO" --add-label deps:review
          else
            gh workflow run ai-implement.yml --repo "$REPO" -f issue="$ISSUE"
          fi

      - name: Clear stage
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --remove-label ai:researching || true

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --add-label ai:blocked || true
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "The research stage failed. See the [run]($RUN_URL). A maintainer can add \`ai:retry\` to run it again." || true
