# Tags declared:
#  - `integration`: requires a live MySQL on `MYSQL_HOST` /
#    `MYSQL_PORT` (defaults `localhost:13306` user/db `conduit_test_*`).
#    See `test/orm_integration_test.dart` for the docker-run snippet.
#
# Integration suites are excluded from a plain `dart test` so the
# package's unit suite runs green without external services. Opt in with
# the `integration` preset: `dart test -P integration`.
tags:
  integration:

exclude_tags: integration

presets:
  integration:
    include_tags: integration
