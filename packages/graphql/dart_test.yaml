# Test runner configuration for conduit_graphql.
#
# `integration` tags gate suites that need an external service (Neo4j,
# Postgres, MySQL). They are excluded from a plain `dart test` so the
# package's unit suite runs green without external services. Opt in with
# the `integration` preset: `dart test -P integration`. See
# test/graph_resolver_neo4j_test.dart for the supported
# `CONDUIT_NEO4J_AVAILABLE` env var.
tags:
  integration:

exclude_tags: integration

presets:
  integration:
    include_tags: integration
